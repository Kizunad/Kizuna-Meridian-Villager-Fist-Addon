# 往 Threatening 的学卷表登记：村民游炁、真炁两档都学袖手拳上卷（崩拳、撩天、背摔）。
# 原版村民没有攻击手段，基础三卷里也没有打人的式；学了这一卷，类人大脑才会照「打得过就打」迎上去，不再只会躲。
# 写法和 meridian-humanoid-brain.toml 的 [volumes] 一节相同，接在配置文件同一档的后面；
# 运营方在配置文件里给村民写同一卷，就照配置文件的概率。
# 中卷做出来以后，真炁在上卷后面再加中卷；上卷必须排在中卷前。
[volumes."minecraft:villager"]
wandering_qi = [
  { volume = "meridian_villager:outer", chance = 1.0 },
]
true_qi = [
  { volume = "meridian_villager:outer", chance = 1.0 },
]
